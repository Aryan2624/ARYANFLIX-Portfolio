<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>ARYANFLIX V12 — project orbit visual check</title><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="src/projectRoom.css"/><link rel="stylesheet" href="src/orbitProjects.css"/><style>*{box-sizing:border-box}body{margin:0;background:#050508;color:#fff;font-family:Arial,sans-serif;padding:20px}h2{color:#fff;font-size:30px}header{display:flex;align-items:center;justify-content:space-between}header span{color:#e50924;letter-spacing:2px}.room-frame{height:auto;width:min(98vw,1260px);aspect-ratio:16/9;margin:0 auto}.room-person{left:50%;bottom:-13%}.room-title{z-index:25}.orb-slot{position:absolute}button{cursor:pointer}.orb-git{font-size:17px;text-decoration:none}.orb-card-open{font-family:inherit}.orb-info small{letter-spacing:1px}</style></head><body><header><h2>ARYAN<span>FLIX</span> — Projects in motion</h2><span>V12 VISUAL CHECK</span></header><div class="room-frame"><div class="room-background"><img src="public/images/aryan-projects.webp"/></div><div class="room-space"><span></span><span></span><span></span></div><div class="room-title"><span>ARYAN M DUBEY</span><strong>PROJECTS IN MOTION</strong></div><div id="orbit" class="orb-universe orb-full"><div class="orb-guide"></div><div class="orb-guide orb-guide-second"></div></div><img class="room-person" src="public/images/aryan-standee.webp"/><div class="room-floor"><i></i><i></i><i></i></div></div><script>
const projects=['CampusIQ','DeepShield AI','StockVision AI','Brain Tumor Classification','Drone Path Optimization','FinGuard AI'];const orbit=document.getElementById('orbit');const slots=[];projects.forEach((p,i)=>{const s=document.createElement('div');s.className='orb-slot';s.innerHTML=`<article class="orb-card"><button class="orb-card-open"><span class="orb-visual"><span class="orb-art-grid"></span><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2L2 8v8l10 6 10-6V8zM2 8l10 6 10-6M12 14v8"/></svg></span><span class="orb-info"><small>PROJECT / 0${i+1}</small><strong>${p}</strong><span>AI · MACHINE LEARNING</span><em>VIEW PROJECT DETAILS ↗</em></span></button></article>`;orbit.appendChild(s);slots.push(s)});let phase=-.34;let last=performance.now();const tick=now=>{let delta=Math.min(now-last,45);last=now;phase+=delta*.00028;const w=orbit.clientWidth,h=orbit.clientHeight;slots.forEach((el,i)=>{let th=phase+i*Math.PI*2/6,x=w*.5+Math.sin(th)*w*.382,y=h*.49+Math.cos(th)*h*.23*.63+Math.sin(th*2)*h*.23*.14,d=Math.cos(th);el.style.transform=`translate3d(${x}px, ${y}px, ${d*220-45}px) translate(-50%, -50%) rotateY(${-Math.sin(th)*27}deg) scale(${.75+(d+1)*.155})`;el.style.opacity=String(.65+(d+1)*.175);el.style.zIndex=String(Math.round(10+(d+1)*3))});requestAnimationFrame(tick)};requestAnimationFrame(tick);
</script></body></html>
